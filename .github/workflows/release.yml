# OmaDrop releases are manual and use this fork's tags. AUR publication is
# separate: this fork does not own the upstream omdrop-owl AUR package.
name: Release

on:
  workflow_dispatch:

concurrency:
  group: release

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'MONKE2525E/OmaDrop' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git github-cli

      - uses: actions/checkout@v4

      - name: Check release version
        id: version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          pkgver=$(sed -n 's/^pkgver=//p' PKGBUILD)
          if git ls-remote --exit-code --tags origin "refs/tags/v$pkgver" >/dev/null; then
            echo "::error::Tag v$pkgver already exists. Bump pkgver before releasing."
            exit 1
          fi
          echo "pkgver=$pkgver" >> "$GITHUB_OUTPUT"

      - name: Build the package
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder "$GITHUB_WORKSPACE"
          sudo -u builder tools/test-aur-pkgbuild.sh -s --noconfirm

      - name: Tag the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PKGVER: ${{ steps.version.outputs.pkgver }}
        run: gh release create "v$PKGVER" --target "$GITHUB_SHA" --title "$PKGVER" --generate-notes
